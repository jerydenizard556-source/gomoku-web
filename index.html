
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR JERY GOMOKU</title>
<style>
:root {
  --bg:#08090d;
  --panel:#141823;
  --gold:#e0b75d;
  --text:#f5f2e9;
  --muted:#9ba3b5;
  --line:#303747;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle at top,#29202b,#08090d 55%);
 color:var(--text);font-family:Arial,sans-serif;min-height:100vh
}
header{
 padding:18px 5%;display:flex;justify-content:space-between;
 align-items:center;border-bottom:1px solid #ffffff20;
 background:#090a0ddd
}
.logo{font-size:24px;font-weight:900;color:var(--gold);letter-spacing:2px}
.status{font-size:12px;color:var(--muted)}
main{width:min(1150px,94%);margin:30px auto}
.hero{text-align:center;margin-bottom:25px}
.hero h1{font-size:clamp(30px,6vw,55px);color:var(--gold);margin:10px}
.hero p{color:var(--muted)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
.panel{
 background:var(--panel);border:1px solid var(--line);
 border-radius:16px;padding:18px
}
h2,h3{color:var(--gold);margin-top:0}
input,select{
 width:100%;padding:12px;margin:6px 0 12px;
 background:#090c13;border:1px solid var(--line);
 border-radius:9px;color:white
}
button{
 padding:11px 13px;border:0;border-radius:9px;
 cursor:pointer;font-weight:bold
}
.primary{background:var(--gold);color:#17120a;width:100%}
.secondary{background:#293044;color:white}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1}
.active{background:#57421f;color:#ffe6a5}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:12px}
.roomcode{font-size:23px;letter-spacing:4px;color:var(--gold);font-weight:bold}
.gamehead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.players{display:flex;gap:8px;flex-wrap:wrap}
.player{background:#252c3a;padding:10px;border-radius:9px;font-size:13px}
.boardwrap{overflow:auto;background:#c69b58;padding:6px;border:7px solid #89602d;border-radius:10px;margin-top:15px}
.board{
 display:grid;grid-template-columns:repeat(var(--n),1fr);
 min-width:300px;width:100%;aspect-ratio:1;
 background-color:#d9b77b;
 background-image:linear-gradient(#795b3266 1px,transparent 1px),linear-gradient(90deg,#795b3266 1px,transparent 1px);
 background-size:calc(100% / var(--n)) calc(100% / var(--n))
}
.cell{padding:0;border:0;background:transparent;position:relative;aspect-ratio:1}
.cell:after{content:"";position:absolute;width:76%;height:76%;left:12%;top:12%;border-radius:50%;transform:scale(0)}
.cell.black:after{transform:scale(1);background:radial-gradient(circle at 30% 25%,#777,#050505 65%)}
.cell.red:after{transform:scale(1);background:radial-gradient(circle at 30% 25%,#ff9999,#8d101a 65%)}
.cell:disabled{cursor:default}
.below{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.chatlog{height:140px;overflow:auto;background:#090c13;padding:10px;border-radius:9px;font-size:13px}
.chatrow{display:flex;gap:6px}
.chatrow input{margin:0}
.chatrow button{background:var(--gold)}
.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#252c3a;padding:12px 18px;border-radius:10px}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 .below{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
 <div class="logo">MR JERY GOMOKU</div>
 <div class="status" id="connection">● Ap konekte...</div>
</header>

<main>
 <section class="hero">
  <div class="muted">STRATEGY • HONOR • VICTORY</div>
  <h1>MR JERY GOMOKU</h1>
  <p>Defi zanmi ou. Jwe. Genyen.</p>
 </section>

 <div class="layout">
  <aside class="panel">
   <div id="authBox">
    <div class="tabs">
     <button class="active" id="loginTab">Konekte</button>
     <button class="secondary" id="registerTab">Kreye kont</button>
    </div>
    <div id="loginForm">
     <label>Pseudo oswa email</label>
     <input id="loginName" placeholder="Pseudo / email">
     <label>Modpas</label>
     <input id="loginPass" type="password" placeholder="Modpas">
     <button class="primary" id="loginBtn">KONEKTE</button>
    </div>
    <div id="registerForm" class="hidden">
     <input id="regUser" placeholder="Pseudo">
     <input id="regEmail" type="email" placeholder="Email">
     <input id="regPass" type="password" placeholder="Modpas">
     <input id="regPass2" type="password" placeholder="Konfime modpas">
     <button class="primary" id="registerBtn">KREYE KONT</button>
    </div>
   </div>

   <div id="profileBox" class="hidden">
    <h3>Kont jwè</h3>
    <div id="profileName"></div>
    <p id="profileStats" class="muted"></p>
    <button class="secondary" id="logoutBtn">Dekonekte</button>
   </div>

   <hr style="border-color:#303747;margin:20px 0">
   <h3>Jwe Gomoku</h3>
   <label>Tan match</label>
   <select id="duration">
    <option value="5">5 minit</option>
    <option value="10" selected>10 minit</option>
    <option value="15">15 minit</option>
    <option value="20">20 minit</option>
    <option value="30">30 minit</option>
   </select>
   <label>Gwosè tablo</label>
   <select id="boardSize">
    <option value="13">13 × 13</option>
    <option value="15">15 × 15</option>
    <option value="17">17 × 17</option>
    <option value="20" selected>20 × 20</option>
   </select>
   <button class="primary" id="createBtn">KREYE CHANM</button>
   <div class="actions">
    <button class="secondary" id="findBtn">Jwenn match</button>
    <button class="secondary" id="cancelFindBtn">Anile rechèch</button>
   </div>
   <p class="muted" id="searchStatus"></p>
   <label>Kòd chanm</label>
   <input id="roomInput" placeholder="Kòd chanm">
   <div class="actions">
    <button class="secondary" id="joinBtn">Antre</button>
    <button class="secondary" id="watchBtn">Spectateur</button>
   </div>
   <div class="actions">
    <button class="secondary" id="roomsBtn">Chanm aktif</button>
    <button class="secondary" id="onlineBtn">Jwè online</button>
   </div>
   <div id="roomList" class="muted"></div>
   <div id="onlineList" class="muted"></div>
  </aside>

  <section class="panel">
   <div class="gamehead">
    <div>
     <div class="muted">CHANM</div>
     <div class="roomcode" id="roomCode">------</div>
    </div>
    <div class="players">
     <div class="player">⚫ NWA <span id="blackName">Jwè 1</span></div>
     <div class="player">🔴 WOUJ <span id="redName">Jwè 2</span></div>
    </div>
   </div>
   <p id="gameMessage" class="muted">Kreye yon chanm pou kòmanse.</p>
   <div class="boardwrap">
    <div class="board" id="board" style="--n:20"></div>
   </div>
   <div class="actions">
    <button class="secondary" id="voiceBtn">🎙 Voice Chat</button>
    <button class="secondary" id="muteBtn" disabled>Mute mic</button>
    <button class="secondary" id="undoBtn">Mande anilasyon</button>
    <button class="secondary" id="rematchBtn">Revanch</button>
    <button class="secondary" id="leaveBtn">Kite match</button>
   </div>
   <div class="below">
    <div>
     <h3>Chat match</h3>
     <div class="chatlog" id="chatLog"></div>
     <div class="chatrow">
      <input id="chatInput" placeholder="Ekri mesaj...">
      <button id="sendChat">Voye</button>
     </div>
    </div>
    <div>
     <h3>Enfòmasyon</h3>
     <p id="gameInfo" class="muted">Ou poko nan match.</p>
     <p class="muted">Premye jwè ki mete 5 pyès youn dèyè lòt genyen.</p>
    </div>
   </div>
  </section>
 </div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
const SERVER = "wss://gomoku-server-5h60.onrender.com";
let ws=null,room="",player=0,username="",accountToken=localStorage.getItem("mrjery_account_token")||"",spectator=false,voiceStream=null,peers=new Map();

const $=id=>document.getElementById(id);
function notify(message){
 $("toast").textContent=message;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),3000);
}
function send(type,data={}){
 if(!ws||ws.readyState!==WebSocket.OPEN){notify("Sèvè a poko konekte.");return;}
 ws.send(JSON.stringify({type,...data}));
}
function connect(){
 ws=new WebSocket(SERVER);
 ws.onopen=()=>{
  $("connection").textContent="● Konekte";
  if(accountToken)send("restore_session",{account_token:accountToken});
 };
 ws.onmessage=e=>{
  let d;
  try{d=JSON.parse(e.data)}catch{return;}
  handle(d);
 };
 ws.onerror=()=>$("connection").textContent="● Erè koneksyon";
 ws.onclose=()=>{
  $("connection").textContent="● Dekonekte";
  setTimeout(connect,4000);
 };
}
function handle(d){
 switch(d.type){
  case "register_result":
  case "login_result":
  case "restore_session_result":
   if(d.success){
    username=d.username||"Jwè";
    accountToken=d.account_token||accountToken;
    localStorage.setItem("mrjery_account_token",accountToken);
    $("authBox").classList.add("hidden");
    $("profileBox").classList.remove("hidden");
    $("profileName").textContent=username;
    $("profileStats").textContent=(d.points||0)+" pwen • "+(d.wins||0)+" viktwa";
    notify("Ou konekte!");
   }else notify(d.message||"Kont lan pa valide.");
   break;

  case "created":
  case "joined":
  case "match_found":
  case "reconnected":
   room=d.room||"";
   player=Number(d.player||0);
   $("roomCode").textContent=room;
   $("roomInput").value=room;
   $("gameMessage").textContent=d.message||"Match pare.";
   notify("Ou antre nan chanm "+room);
   break;

  case "searching":
   $("searchStatus").textContent=d.message||"Ap chèche advèsè...";
   break;

  case "match_cancelled":
   $("searchStatus").textContent="Rechèch anile.";
   break;

  case "watching":
   room=d.room;
   player=0;
   spectator=true;
   $("roomCode").textContent=room;
   $("gameInfo").textContent="Ou se spectateur.";
   break;

  case "error":
  case "watch_error":
   notify(d.message||"Erè.");
   break;

  case "state":
   renderState(d);
   break;

  case "rooms_list":
   renderRooms(d.rooms||[]);
   break;

  case "online_players":
   renderPlayers(d.players||[]);
   break;

  case "game_invite":
   if(confirm((d.from_username||"Yon jwè")+" envite w nan match. Aksepte?")){
    send("invite_response",{invitation_id:d.invitation_id,accepted:true});
   }else{
    send("invite_response",{invitation_id:d.invitation_id,accepted:false});
   }
   break;

  case "voice_peer_list":
   (d.peers||[]).forEach(id=>makePeer(id,true));
   break;

  case "voice_peer_join":
   makePeer(d.peer_id,false);
   break;

  case "voice_signal":
   receiveSignal(d);
   break;
 }
}
function renderState(s){
 const b=s.board||[];
 const n=b.length||20;
 $("board").style.setProperty("--n",n);
 $("board").innerHTML="";
 for(let r=0;r<n;r++){
  for(let c=0;c<n;c++){
   const v=b[r]?.[c]||0;
   const cell=document.createElement("button");
   cell.className="cell"+(v===1?" black":v===2?" red":"");
   cell.disabled=!!v||!!s.game_over||spectator||!player||Number(s.turn)!==player;
   cell.onclick=()=>send("move",{room,row:r,col:c});
   $("board").appendChild(cell);
  }
 }
 const p1=s.players?.["1"]||{};
 const p2=s.players?.["2"]||{};
 $("blackName").textContent=p1.username||"Jwè 1";
 $("redName").textContent=p2.username||"Jwè 2";
 $("gameMessage").textContent=s.game_over?
  (s.draw?"Match nil.":"Match fini. Gayan: "+(s.winner===1?p1.username:p2.username)):
  (s.waiting?"Ap tann dezyèm jwè...":"Se tou "+(s.turn===1?"NWA":"WOUJ")+" pou jwe.");
 $("gameInfo").textContent="Spectatè: "+(s.spectator_count||0);
 $("chatLog").innerHTML="";
 (s.chat||[]).forEach(m=>{
  const line=document.createElement("p");
  line.textContent=(m.sender||"Jwè")+": "+(m.text||"");
  $("chatLog").appendChild(line);
 });
}
function renderRooms(items){
 $("roomList").innerHTML="";
 items.forEach(x=>{
  const btn=document.createElement("button");
  btn.className="secondary";
  btn.textContent="Gade "+x.room;
  btn.onclick=()=>send("watch",{room:x.room});
  $("roomList").appendChild(btn);
 });
 if(!items.length)$("roomList").textContent="Pa gen chanm aktif.";
}
function renderPlayers(items){
 $("onlineList").innerHTML="";
 items.forEach(p=>{
  const btn=document.createElement("button");
  btn.className="secondary";
  btn.textContent="Defi "+p.username;
  btn.onclick=()=>send("invite_player",{target_player_id:p.player_id});
  $("onlineList").appendChild(btn);
 });
}
$("loginTab").onclick=()=>{
 $("loginForm").classList.remove("hidden");
 $("registerForm").classList.add("hidden");
 $("loginTab").classList.add("active");
 $("registerTab").classList.remove("active");
};
$("registerTab").onclick=()=>{
 $("registerForm").classList.remove("hidden");
 $("loginForm").classList.add("hidden");
 $("registerTab").classList.add("active");
 $("loginTab").classList.remove("active");
};
$("loginBtn").onclick=()=>send("login",{
 login:$("loginName").value,
 password:$("loginPass").value
});
$("registerBtn").onclick=()=>send("register",{
 username:$("regUser").value,
 email:$("regEmail").value,
 password:$("regPass").value,
 password_confirmation:$("regPass2").value
});
$("logoutBtn").onclick=()=>{
 localStorage.removeItem("mrjery_account_token");
 accountToken="";
 send("logout_session",{account_token:accountToken});
};
$("createBtn").onclick=()=>send("create",{
 duration_minutes:Number($("duration").value),
 board_size:Number($("boardSize").value)
});
$("joinBtn").onclick=()=>send("join",{room:$("roomInput").value});
$("watchBtn").onclick=()=>send("watch",{room:$("roomInput").value});
$("findBtn").onclick=()=>send("find_match");
$("cancelFindBtn").onclick=()=>send("cancel_match");
$("roomsBtn").onclick=()=>send("rooms_list");
$("onlineBtn").onclick=()=>send("online_players");
$("sendChat").onclick=()=>{
 const message=$("chatInput").value.trim();
 if(message&&room){
  send("chat",{room,message});
  $("chatInput").value="";
 }
};
$("chatInput").onkeydown=e=>{if(e.key==="Enter")$("sendChat").click()};
$("undoBtn").onclick=()=>send("undo_request",{room});
$("rematchBtn").onclick=()=>send("rematch_request",{room});
$("leaveBtn").onclick=()=>{
 if(room&&confirm("Ou vle kite match la?"))send("leave_match",{room});
};
async function startVoice(){
 if(!room){notify("Antre nan match anvan.");return;}
 try{
  voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
  send("voice_join",{room});
  $("muteBtn").disabled=false;
  $("voiceBtn").textContent="Voice aktive";
 }catch(e){notify("Ou dwe bay pèmisyon mikwo a.");}
}
function makePeer(id,initiator){
 if(!voiceStream||peers.has(id))return;
 const pc=new RTCPeerConnection({
  iceServers:[{urls:"stun:stun.l.google.com:19302"}]
 });
 peers.set(id,pc);
 voiceStream.getTracks().forEach(t=>pc.addTrack(t,voiceStream));
 pc.onicecandidate=e=>{
  if(e.candidate)send("voice_signal",{
   room,to:id,signal_type:"ice",payload:e.candidate.toJSON()
  });
 };
 pc.ontrack=e=>{
  let audio=document.getElementById("audio_"+id);
  if(!audio){
   audio=document.createElement("audio");
   audio.id="audio_"+id;
   audio.autoplay=true;
   document.body.appendChild(audio);
  }
  audio.srcObject=e.streams[0];
 };
 if(initiator){
  pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>{
   send("voice_signal",{
    room,to:id,signal_type:"description",
    payload:pc.localDescription.toJSON()
   });
  }).catch(()=>{});
 }
}
async function receiveSignal(d){
 if(!voiceStream)return;
 let pc=peers.get(d.from_id);
 if(!pc){makePeer(d.from_id,false);pc=peers.get(d.from_id);}
 if(!pc)return;
 try{
  if(d.signal_type==="description"){
   await pc.setRemoteDescription(d.payload);
   if(d.payload.type==="offer"){
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send("voice_signal",{
     room,to:d.from_id,signal_type:"description",
     payload:pc.localDescription.toJSON()
    });
   }
  }else if(d.signal_type==="ice"){
   await pc.addIceCandidate(d.payload);
  }
 }catch(e){console.log(e);}
}
$("voiceBtn").onclick=()=>{
 if(voiceStream){
  voiceStream.getTracks().forEach(t=>t.stop());
  peers.forEach(pc=>pc.close());
  peers.clear();
  voiceStream=null;
  $("voiceBtn").textContent="🎙 Voice Chat";
  $("muteBtn").disabled=true;
 }else startVoice();
};
$("muteBtn").onclick=()=>{
 if(!voiceStream)return;
 const track=voiceStream.getAudioTracks()[0];
 track.enabled=!track.enabled;
 $("muteBtn").textContent=track.enabled?"Mute mic":"Unmute mic";
};
connect();
})();
</script>
</body>
</html>
